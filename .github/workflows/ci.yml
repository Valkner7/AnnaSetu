name: CI

# Lints every PHP file and runs the offline checks in tests/. No database or
# network is needed. Runs on Linux, so it also catches folder-casing problems
# that XAMPP on Windows hides (H3).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, pdo_sqlite

      - name: Lint all PHP files
        run: |
          status=0
          for f in $(git ls-files '*.php'); do
            php -l "$f" > /dev/null || status=1
          done
          exit $status

      - name: Run PHP checks
        run: |
          status=0
          for t in tests/check_*.php; do
            echo "== $t"
            php "$t" > /tmp/check.out 2>&1 || status=1
            cat /tmp/check.out
            # A SKIP means a test did not really run (for example a missing
            # PHP extension). Treat that as a failure so it cannot hide.
            if grep -q '^SKIP' /tmp/check.out; then
              echo "::error::$t was skipped"
              status=1
            fi
          done
          exit $status

      - name: Run JavaScript checks
        run: |
          status=0
          for t in tests/check_*.js; do
            echo "== $t"
            node "$t" || status=1
          done
          exit $status

  mandi-service:
    # The embedded price service (ai/mandi_service). Same Python and install steps
    # as its own test workflow in the source repo. test_scenarios.py is left out here:
    # it needs a Gemini key for its last stage and is report-only without one.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai/mandi_service
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run service tests
        run: |
          status=0
          for t in test_explanations test_observability test_data_age test_spa_routes test_api_secret test_question_limit test_advisory_no_key test_gemini_model test_training_gate test_fetch_redaction test_slim_mode; do
            echo "== $t"
            python $t.py || status=1
          done
          exit $status

      - name: Run data gap report check
        # Lives in tests/ and tools/ (outside the synced snapshot); needs pandas from the install above.
        run: python ../../tests/check_mandi_data_gap.py

  database-setup:
    # Runs setup_db.php against a real database server, twice, then checks the result
    # (tests/db/check_setup_db.php): all tables, 6 crops after re-runs, crops.name_pa, and the
    # upgrade path for a database that already has duplicate crops. The offline checks above
    # cannot see any of this. MariaDB is what XAMPP ships; MySQL 8 is the other common server.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: ["mariadb:10.11", "mysql:8.0"]
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql

      - name: Point the app at the test database
        run: |
          cp config/database.example.php config/database.php
          sed -i "s/your_password_here/root/" config/database.php

      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO("mysql:host=127.0.0.1;port=3306", "root", "root");' 2>/dev/null && exit 0
            sleep 2
          done
          echo "::error::database did not start"
          exit 1

      - name: Run setup_db.php twice
        run: |
          php setup_db.php
          php setup_db.php

      - name: Check the database
        run: php tests/db/check_setup_db.php
